<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeedImage logo">
  <defs>
    <linearGradient id="si-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b8cff"/>
      <stop offset="0.5" stop-color="#6d5bff"/>
      <stop offset="1" stop-color="#38e0c7"/>
    </linearGradient>
    <linearGradient id="si-bolt" x1="22" y1="9" x2="42" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dffaf2"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#si-bg)"/>
  <!-- Top sheen -->
  <path d="M18 3h28a15 15 0 0 1 15 15v4H3v-4A15 15 0 0 1 18 3Z" fill="#ffffff" opacity="0.12"/>

  <!-- Photo: sun + mountains (the "image") -->
