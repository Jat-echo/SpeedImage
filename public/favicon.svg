  <path d="M5 52 V40 l11-12 10 12 8-7 12 13 v6 a4 4 0 0 1-4 4 H9 a4 4 0 0 1-4-4 Z" fill="#ffffff" opacity="0.28"/>

  <!-- Speed bolt -->
  <path d="M37 7 L19 35 h11 l-4 22 21-30 H35 Z" fill="url(#si-bolt)" stroke="#0b1020" stroke-width="0.5" stroke-opacity="0.06" stroke-linejoin="round"/>
